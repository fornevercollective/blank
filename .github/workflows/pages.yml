# Publish static UI from support/ to GitHub Pages.
# Enable once: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
# Project site URL: https://fornevercollective.github.io/blank/

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install cache tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --user yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Pages intel cache
        run: node support/scripts/build-pages-cache.mjs "https://www.youtube.com/watch?v=SKia5QUiGkE"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: support

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
