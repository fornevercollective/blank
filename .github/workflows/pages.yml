# Publish static UI from support/ to GitHub Pages.
# Enable once: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
# Project site URL: https://fornevercollective.github.io/blank/
#
# Pages intel is committed under support/pages-cache/ (YouTube blocks yt-dlp on CI runners).
# Refresh locally: node support/scripts/build-pages-cache.mjs [--force]

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Verify Pages intel cache
        run: |
          INTEL="support/pages-cache/SKia5QUiGkE/intel.json"
          MANIFEST="support/pages-cache/SKia5QUiGkE/manifest.json"
          if [ ! -f "$INTEL" ] || [ ! -f "$MANIFEST" ]; then
            echo "::error::Missing pages-cache bundle. On a machine with yt-dlp + ffmpeg, run:"
            echo "  node support/scripts/build-pages-cache.mjs"
            echo "Then commit support/pages-cache/ and push."
            exit 1
          fi
          node --input-type=module -e "
            import fs from 'node:fs';
            const m = JSON.parse(fs.readFileSync('${MANIFEST}','utf8'));
            const scenes = fs.readdirSync('support/pages-cache/SKia5QUiGkE/scenes').filter((f) => f.endsWith('.jpg'));
            if (!scenes.length) {
              console.error('::error::No scene JPEGs in pages-cache');
              process.exit(1);
            }
            console.log('Pages cache OK:', m.title);
            console.log('  scenes:', scenes.length, '| captions:', m.captionLines);
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: support

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
